# Netlify deployment for the battery digital twin.
#
# Netlify serves files; Streamlit needs a long-lived Python process, so it cannot
# host `app.py` itself.  This project therefore ships a prebuilt static export of
# the dashboard in `site/` (same pages, same charts, same numbers), generated by
#
#     python -m dashboard.static_export
#
# Rebuild that folder after changing anything in `dashboard/`, then publish with
#
#     netlify deploy --prod
#
# or by dragging `site/` onto the Netlify dashboard. No build step runs on Netlify:
# the export needs the local datasets and trained models, which are not in the repo.

[build]
  publish = "site"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Extensionless URLs, matching the Streamlit page paths.
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/configuration"
  to = "/configuration.html"
  status = 200

[[redirects]]
  from = "/simulator"
  to = "/simulator.html"
  status = 200

[[redirects]]
  from = "/prediction"
  to = "/prediction.html"
  status = 200

[[redirects]]
  from = "/ageing"
  to = "/ageing.html"
  status = 200

[[redirects]]
  from = "/sources"
  to = "/sources.html"
  status = 200

[[redirects]]
  from = "/datasets"
  to = "/datasets.html"
  status = 200

[[redirects]]
  from = "/ml-lab"
  to = "/ml-lab.html"
  status = 200

[[redirects]]
  from = "/research"
  to = "/research.html"
  status = 200

[[redirects]]
  from = "/assistant"
  to = "/assistant.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
